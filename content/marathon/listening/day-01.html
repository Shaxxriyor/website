:root{--red:#cf1f2e;--red2:#e8434f;--pink:#f9e2e0;--pinkline:#f1d3cf;--paper:#fbf7f4;--ink:#1d1b1b;--grey:#8a8584;--line:#e9dfdb;--green:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- login ---------- */
#entry{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid var(--pinkline);border-radius:18px;width:100%;max-width:420px;padding:36px 34px 30px;text-align:center;box-shadow:0 10px 30px rgba(207,31,46,.06)}
.card img{height:72px}
.card .kick{color:var(--red);font-weight:700;letter-spacing:.22em;font-size:11px;margin-top:22px}
.card h1{font-size:30px;font-weight:700;line-height:1.15;margin:4px 0 24px}
.card h1 span{color:var(--grey);font-weight:300;font-size:20px}
.card input{width:100%;border:1.5px solid var(--pinkline);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;text-align:center;background:var(--paper)}
.card input:focus{outline:none;border-color:var(--red);background:#fff}
.card input.bad{border-color:var(--red)}
.go{margin-top:14px;width:100%;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:600;color:#fff;background:var(--red);position:relative;overflow:hidden}
.go:disabled{background:#e9c9c6;cursor:default}
.go .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--red);transition:width .2s}
.go .lbl{position:relative}
.dlerr{color:var(--red);font-size:12.5px;margin-top:10px}
.dlerr button{border:0;background:none;color:var(--red);text-decoration:underline;font-size:12.5px}

/* ---------- top bar ---------- */
#exam{position:fixed;inset:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 22px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.top .l{display:flex;align-items:center;gap:18px}
.top img{height:34px;display:block}
.top .who{font-size:13px;color:var(--grey)}
.top .who b{color:var(--ink);font-weight:600}
.pill{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--pink);color:var(--red);padding:6px 14px;border-radius:999px}
.pill.off{background:#eee;color:#777}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.pill.off .dot{background:#999;animation:none}
@keyframes pulse{50%{opacity:.25}}
.top .r{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--grey)}
.top input[type=range]{width:100px;accent-color:var(--red)}

/* ---------- page ---------- */
main{flex:1 1 auto;overflow:auto;padding:34px 70px 120px 56px}
.part{display:none;max-width:1180px;margin:0 auto}
.part.on{display:block}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.day{color:var(--red);font-weight:700;letter-spacing:.24em;font-size:12px}
.ptitle{font-size:44px;font-weight:700;line-height:1.05;margin-top:2px}
.ptitle span{font-size:22px;font-weight:300;color:var(--grey)}
.pright{text-align:right}
.dots{display:flex;gap:7px;justify-content:flex-end;margin-bottom:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:#f0dedb}
.dots i.on{background:var(--red)}
.ptype{font-size:10.5px;font-weight:600;letter-spacing:.16em;color:#555;margin-bottom:6px}
.qpill{display:inline-block;background:var(--red);color:#fff;font-size:13.5px;font-weight:500;padding:5px 16px;border-radius:999px}
.rule{position:relative;height:2px;background:var(--pinkline);margin:12px 0 22px}
.rule::before{content:"";position:absolute;left:0;top:-1px;width:62px;height:4px;background:var(--red)}
.instr{display:flex;gap:16px;align-items:center;background:var(--pink);border-radius:14px;padding:16px 20px;margin-bottom:22px;font-size:14px}
.instr .play{flex:0 0 30px;height:30px;border-radius:50%;background:var(--red);position:relative}
.instr .play::after{content:"";position:absolute;left:11px;top:8px;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.instr b{color:var(--red)}
.extract{display:inline-block;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.16em;padding:4px 12px;border-radius:999px;margin:16px 0 8px}
.context{font-style:italic;color:#444;margin-bottom:10px;font-size:14px}

/* mcq */
.q{display:flex;gap:14px;padding:12px 6px 14px;border-bottom:1px solid var(--line);scroll-margin-top:30px;border-radius:6px}
.q:last-child{border-bottom:0}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.q.cur .num{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--red)}
.qbody{flex:1}
.qt{font-weight:500;font-size:15.5px;margin-bottom:6px}
.opts{display:grid;gap:2px}
.opts.row{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.opts.row{grid-template-columns:1fr}}
.opt{display:flex;align-items:flex-start;gap:10px;padding:4px 8px;border-radius:8px;cursor:pointer;font-weight:300;font-size:14.5px}
.opt:hover{background:#fff}
.opt input{position:absolute;opacity:0;pointer-events:none}
.bx{flex:0 0 20px;height:20px;border:1.5px solid var(--red);border-radius:6px;color:var(--red);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff}
.opt.sel .bx{background:var(--red);color:#fff}
.opt.sel span{font-weight:500}

/* matching */
.tasks.two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
@media(max-width:900px){.tasks.two{grid-template-columns:1fr}}
.task{text-transform:uppercase;display:inline-block;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.16em;padding:4px 12px;border-radius:999px;margin-bottom:8px}
.tinstr{font-style:italic;color:#555;margin-bottom:10px;font-size:14px}
.pool{background:#fff;border:1px solid var(--pinkline);border-radius:16px;padding:14px 16px;margin-bottom:24px}
.chip{display:flex;align-items:flex-start;gap:12px;padding:5px 8px;border-radius:8px;cursor:grab;user-select:none;font-size:15px;border:1.5px solid transparent}
.chip:hover{background:var(--paper)}
.chip.sel{border-color:var(--red);background:var(--pink)}
.chip.used{opacity:.4}
.lb{flex:0 0 20px;height:20px;border-radius:50%;background:var(--pink);color:var(--red);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.ya{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:#555;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
.scard{background:#fff;border:1px solid var(--pinkline);border-radius:12px;padding:10px 12px 14px;scroll-margin-top:30px}
.scard .h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
.scard .h .num{flex:0 0 22px;height:22px;font-size:11px;margin:0}
.zone{width:56px;height:48px;margin:0 auto;border:2px solid var(--red2);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--red);cursor:pointer}
.zone.over{background:var(--pink)}
.zone.cur{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.zt{font-size:11.5px;color:#555;text-align:center;margin-top:8px;min-height:17px;font-weight:300;line-height:1.35}
.rows .srow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--pinkline);border-radius:12px;padding:8px 12px;margin-bottom:8px;scroll-margin-top:30px}
.rows .srow .num{flex:0 0 22px;height:22px;font-size:11px;margin:0}
.rows .srow .s{font-size:13px;flex:0 0 70px}
.rows .zone{width:56px;height:30px;font-size:15px;margin:0 0 0 auto;border-radius:8px}
.rows .zt{flex:1;text-align:left;margin:0}
mark.hl{background:#fde68a;color:inherit}

/* review */
.opt.right .bx{background:var(--green);border-color:var(--green);color:#fff}
.opt.right span{color:var(--green);font-weight:600}
.opt.wrong .bx{background:#7f1d1d;border-color:#7f1d1d;color:#fff}
.opt.wrong span{text-decoration:line-through}
.zone.right{border-color:var(--green);color:var(--green);background:#f0fdf4}
.zone.wrong{border-color:#7f1d1d;color:#7f1d1d;background:#fff1f1;text-decoration:line-through}
.fix{color:var(--green);font-weight:600}

/* side tab */
.side{position:fixed;right:0;top:118px;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:10px 7px;border-radius:10px 0 0 10px;writing-mode:vertical-rl;letter-spacing:.05em;z-index:4}

/* footer */
footer.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;min-height:58px}
.parts{display:flex;flex:1;overflow-x:auto}
.pblk{display:flex;align-items:center;gap:8px;padding:8px 16px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:14px}
.pblk .pl{font-weight:600}
.pblk.on .pl{color:var(--red)}
.pblk .cnt{color:var(--grey);font-size:13px}
.qb{width:30px;height:30px;border:1.5px solid #d9cfcc;background:#fff;border-radius:50%;font-size:12px;font-weight:600;color:var(--ink)}
.qb.ans{border-color:var(--red);background:var(--pink);color:var(--red)}
.qb.cur{box-shadow:0 0 0 2px var(--ink)}
.qb.ok{background:#dcfce7;border-color:var(--green);color:var(--green)}
.qb.no{background:#fee2e2;border-color:#7f1d1d;color:#7f1d1d}
.submit{margin:9px 14px;width:40px;height:40px;border:0;border-radius:50%;background:var(--red);color:#fff;font-size:19px;font-weight:700;align-self:center}
.arrows{position:fixed;right:24px;bottom:74px;z-index:6;display:flex;gap:6px}
.arrows button{width:46px;height:42px;border:0;border-radius:8px;font-size:20px;color:#fff}
.arrows .prev{background:#a8a3a2}
.arrows .next{background:var(--ink)}

/* highlight */
#hlpop{position:fixed;z-index:20;background:var(--ink);border-radius:8px;display:flex;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#hlpop button{background:none;border:0;color:#fff;padding:7px 12px;font-size:12.5px}
#hlpop button:hover{background:#444}

/* modals */
.modal{position:fixed;inset:0;z-index:30;background:rgba(29,27,27,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:28px 30px}
.mbox h2{font-size:24px;font-weight:700;margin-bottom:6px}
.mbox p{margin-bottom:10px;font-size:14.5px}
.mrowb{display:flex;gap:10px;margin-top:18px}
.mrowb button{flex:1;border-radius:10px;padding:12px;font-size:14.5px;font-weight:600;border:1.5px solid var(--red);background:#fff;color:var(--red)}
.mrowb button.solid{background:var(--red);color:#fff}
.score{font-size:46px;font-weight:700;color:var(--red);line-height:1.1;margin:6px 0 10px}
.score span{font-size:22px;color:var(--grey);font-weight:300}
.pscore{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.pscore div{background:var(--paper);border:1px solid var(--pinkline);border-radius:12px;padding:8px;text-align:center;font-size:12.5px;color:#555}
.pscore b{display:block;font-size:17px;color:var(--ink)}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.res th{font-size:10.5px;letter-spacing:.14em;color:#555;text-transform:uppercase}
td.ok{color:var(--green);font-weight:700}
td.no{color:var(--red);font-weight:700}
</style>
</head>

  <table class="res"><thead><tr><th>Q</th><th>Your answer</th><th>Correct</th><th></th></tr></thead><tbody id="r-body"></tbody></table>
  <div class="mrowb"><button id="r-review">Review answers</button><button class="solid" id="r-again">Try again</button></div>
</div></div>

<audio id="aud" preload="none"></audio>

<script>
/* ===== EDIT PER DAY ===== */
const DATA = {"day": 1, "audio": "Marathon day 1.mp3", "parts": [{"groups": [{"type": "mcq", "instr": "You will hear people talking in eight different situations. For questions 1–8, choose the best answer (A, B or C).", "items": [{"q": "You hear a restaurant manager talking about the cooks who work for him. What does he say about them?", "o": ["They dislike cleaning tasks.", "They have a choice of jobs.", "They help to decide the menu."]}, {"q": "You hear a woman talking about a new book. What does she particularly like about the book?", "o": ["It is educational.", "It is well organised.", "It is enjoyable."]}, {"q": "You hear the writer of a television soap opera being interviewed about the programme. What will happen next in the story?", "o": ["Someone will make an important decision.", "Someone will go away unexpectedly.", "Someone will learn the truth at last."]}, {"q": "You hear part of a radio interview. Who is speaking?", "o": ["a taxi driver", "a porter", "a tourist guide"]}, {"q": "You hear a woman talking about how she keeps fit. Why did she decide to take up line dancing?", "o": ["She thought the pace would suit her.", "She had heard about it on television.", "She wanted to try exercising to music."]}, {"q": "You overhear a conversation in a restaurant. What does the woman think about the food she has just eaten?", "o": ["It was expensive.", "It was delicious.", "It looked wonderful."]}, {"q": "You turn on the radio and hear a man talking. What is he talking about?", "o": ["drawing pictures", "writing fiction", "composing music"]}, {"q": "You overhear a student phoning her parents. What is her opinion of the place she is living in while at college?", "o": ["She is not sure she will have enough room to study.", "She has difficulty in working because of the noise.", "She does not get on well with her room-mates."]}]}]}, {"groups": [{"type": "match", "instr": "You will hear five different speakers. For questions 9–13, choose from the list (A–F) which opinion each speaker expresses. Use the letters only once. There is one extra letter which you do not need to use.", "options": ["allow staff to take decisions.", "encourage staff to work in teams.", "listen to complaints from staff.", "give information on individual progress.", "have good qualifications.", "set an example of hard work."], "items": ["Speaker 1", "Speaker 2", "Speaker 3", "Speaker 4", "Speaker 5"]}]}, {"groups": [{"type": "mcq", "instr": "You will hear people talking in eight different situations. For questions 14–21, choose the best answer (A, B or C).", "items": [{"q": "You overhear a woman talking to her husband on a mobile phone. What is the background to the conversation?", "o": ["The family’s holiday may have to be cancelled.", "The woman wants to buy their son a computer.", "Their son has schoolwork to complete before the start of term."]}, {"q": "You hear a phone-in programme on the radio. Why has the man phoned?", "o": ["to complain about the traffic scheme", "to express his support for the traffic scheme", "to question the aims of the traffic scheme"]}, {"q": "On the radio, you hear a woman talking about her house. What has she recently done?", "o": ["decided to move to another area", "solved a problem that she had", "made improvements to her house"]}, {"q": "You overhear two people discussing a friend. What language does their friend usually speak at home?", "o": ["French", "English", "Italian"]}, {"q": "You hear a man talking about an activity holiday he went on as a child with his family. How did he feel during the holiday?", "o": ["bored by the climbing", "upset with his father", "disappointed with the rowing boat"]}, {"q": "You hear the beginning of a radio programme. What is the programme going to be about?", "o": ["child development", "the environment", "a form of entertainment"]}, {"q": "You hear a man being interviewed about a new project he has set up. What is the purpose of the project?", "o": ["to help people find accommodation in Scotland", "to tell people where to stay in Australia", "to advise people how to set up a flat agency"]}, {"q": "You switch on the radio in the middle of a programme. What kind of programme is it?", "o": ["an arts review", "an interview", "a quiz show"]}]}]}, {"groups": [{"type": "match", "instr": "You will hear five different speakers. For questions 22–26, choose from the list (A–F) which opinion each speaker expresses. Use the letters only once. There is one extra letter which you do not need to use.", "options": ["Music helps me concentrate when I’m studying.", "I study best in the morning when I can think clearly.", "I realise I study better when I’m outside in the open air.", "I find I can concentrate better when I study with a friend.", "It is much easier for me to study late at night.", "I prefer to study when I’m lying down."], "items": ["Speaker 1", "Speaker 2", "Speaker 3", "Speaker 4", "Speaker 5"]}]}], "key": ["B", "C", "C", "B", "A", "B", "C", "A", "E", "A", "D", "B", "F", "C", "B", "B", "A", "A", "C", "A", "C", "C", "A", "F", "D", "E"]};
const AUDIO_BASE = "https://raw.githubusercontent.com/Shaxxriyor/listening-marathon/main/";
/* ======================== */

const $ = s => document.querySelector(s);
const L = i => String.fromCharCode(65 + i);
const AUDIO_URL = AUDIO_BASE + encodeURIComponent(DATA.audio);
const STORE = "rcdi-marathon-day-" + DATA.day;
const CHECK_SECONDS = 120;
const DD = String(DATA.day).padStart(2, "0");

let answers = {}, questions = [];
let curPart = 0, curQ = 1, finished = false, reviewing = false;
let audioReadyFlag = false, name = "";

(function number(){
  let n = 1;
  DATA.parts.forEach((p, pi) => {
    p.first = n;
    p.groups.forEach(g => { g.first = n; g.items.forEach(() => { questions.push({n, part: pi, group: g}); n++; }); g.last = n - 1; });
    p.last = n - 1;
  });
})();
const TOTAL = questions.length;

function save(){ try{ localStorage.setItem(STORE, JSON.stringify({answers, name})); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(STORE) || "null"); if(s){ answers = s.answers || {}; if(s.name) $("#e-name").value = s.name; } }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){ s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
// bold numbers / key words in instructions like the book
function rich(s){ return esc(s).replace(/\b(\d+–\d+|[A-H]–[A-H]|two|three|five|eight|both)\b/g, "<b>$1</b>").replace(/\(([A-C]), ([A-C]) or ([A-C])\)/g, "(<b>$1</b>, <b>$2</b> or <b>$3</b>)"); }

/* ---------- login + automatic audio download ---------- */
$("#e-title").innerHTML = "Day " + DD + ' <span>/ 20</span>';
document.title = "Listening Marathon Day " + DATA.day + " | READING_CDI";
load();

async function getCached(){ try{ if(!("caches" in window)) return null; const c = await caches.open("rcdi-marathon-audio"); const r = await c.match(AUDIO_URL); return r ? await r.blob() : null; }catch(e){ return null; } }
async function putCached(b){ try{ if(!("caches" in window)) return; const c = await caches.open("rcdi-marathon-audio"); await c.put(AUDIO_URL, new Response(b, {headers:{"Content-Type":"audio/mpeg"}})); }catch(e){} }

function ready(blob){
  $("#aud").src = URL.createObjectURL(blob);
  audioReadyFlag = true;
  $("#dl-fill").style.width = "100%";
  $("#start-lbl").textContent = "Start test";
  $("#start-btn").disabled = false;
}
async function download(){
  $("#dl-err").classList.add("hidden");
  $("#start-lbl").textContent = "Downloading audio…";
  const cached = await getCached();
  if(cached && cached.size > 100000) return ready(cached);
  try{
    const res = await fetch(AUDIO_URL);
    if(!res.ok) throw new Error(res.status);
    const total = +res.headers.get("Content-Length") || 0;
    const rd = res.body.getReader(), chunks = []; let got = 0;
    for(;;){
      const {done, value} = await rd.read(); if(done) break;
      chunks.push(value); got += value.length;
      if(total){ const p = Math.floor(got / total * 100); $("#dl-fill").style.width = p + "%"; $("#start-lbl").textContent = "Downloading audio… " + p + "%"; }
    }
    const blob = new Blob(chunks, {type: "audio/mpeg"});
    putCached(blob); ready(blob);
  }catch(e){
    $("#start-lbl").textContent = "Audio not downloaded";
    $("#dl-err").classList.remove("hidden");
  }
}
$("#dl-retry").onclick = download;
download();

$("#e-name").addEventListener("keydown", e => { if(e.key === "Enter" && audioReadyFlag) $("#start-btn").click(); });
$("#start-btn").onclick = () => {
  name = $("#e-name").value.trim();
  if(!name){ $("#e-name").classList.add("bad"); $("#e-name").focus(); return; }
  save();
  try{ const d = document.documentElement; const r = (d.requestFullscreen || d.webkitRequestFullscreen).call(d); if(r && r.catch) r.catch(()=>{}); }catch(e){}
  $("#entry").classList.add("hidden"); $("#exam").classList.remove("hidden");
  $("#h-name").textContent = name; $("#side").textContent = DD;
  buildExam(); showPart(0); startAudio();
};

/* ---------- audio: plays once, no pause, no seek ---------- */
const aud = $("#aud");
let audioDone = false, checkLeft = CHECK_SECONDS, checkTimer = null, lastT = 0;
function startAudio(){
  aud.currentTime = 0; aud.play().catch(()=>{});
  aud.addEventListener("pause", () => { if(!audioDone && !finished) aud.play().catch(()=>{}); });
  aud.addEventListener("seeking", () => { if(!finished && Math.abs(aud.currentTime - lastT) > 1.5) aud.currentTime = lastT; });
  aud.addEventListener("timeupdate", () => { lastT = aud.currentTime; if(!audioDone) $("#h-time").textContent = "· " + fmt((aud.duration || 0) - aud.currentTime); });
  aud.addEventListener("ended", onAudioEnd);
}
$("#vol").oninput = e => { aud.volume = +e.target.value; };
function onAudioEnd(){
  if(audioDone) return; audioDone = true;
  $("#h-pill").classList.add("off"); $("#h-status").textContent = "Check your answers";
  $("#h-time").textContent = "· " + fmt(checkLeft);
  checkTimer = setInterval(() => { checkLeft--; $("#h-time").textContent = "· " + fmt(checkLeft); /* READING_CDI: no time limit */ }, 1000);
}

/* ---------- build pages ---------- */
function typeLabel(p){
  const m = p.groups.filter(g => g.type === "match").length;
  if(m > 1) return "MULTIPLE MATCHING";
  return p.groups[0].type === "mcq" ? "MULTIPLE CHOICE" : "MATCHING";
}
function buildExam(){
  const area = $("#qarea"); area.innerHTML = "";
  const np = DATA.parts.length;
  DATA.parts.forEach((p, pi) => {
    const sec = document.createElement("section"); sec.className = "part"; sec.id = "part-" + pi;
    const dots = Array.from({length: np}, (_, i) => `<i class="${i <= pi ? "on" : ""}"></i>`).join("");
    sec.innerHTML = `<div class="phead"><div><div class="day">DAY ${DD}</div><div class="ptitle">Part ${pi + 1} <span>/ ${np}</span></div></div>
      <div class="pright"><div class="dots">${dots}</div><div class="ptype">${typeLabel(p)}</div><span class="qpill">Questions ${p.first}–${p.last}</span></div></div><div class="rule"></div>`;
    const matches = p.groups.filter(g => g.type === "match");
    if(p.lead) sec.insertAdjacentHTML("beforeend", `<div class="instr"><span class="play"></span><div>${rich(p.lead)}</div></div>`);
    let wrap = sec;
    if(matches.length > 1){ wrap = document.createElement("div"); wrap.className = "tasks two"; sec.appendChild(wrap); }
    p.groups.forEach(g => {
      const box = document.createElement("div");
      if(g.task) box.insertAdjacentHTML("beforeend", `<span class="task">${esc(g.task)}</span><div class="tinstr">${esc(g.instr)}</div>`);
      else box.insertAdjacentHTML("beforeend", `<div class="instr"><span class="play"></span><div>${rich(g.instr)}</div></div>`);
      if(g.type === "mcq") buildMcq(box, g); else buildMatch(box, g, matches.length > 1);
      wrap.appendChild(box);
    });
    area.appendChild(sec);
  });
  buildFooter(); restoreAnswers();
}

function buildMcq(box, g){
  g.items.forEach((it, i) => {
    const n = g.first + i;
    if(it.extract) box.insertAdjacentHTML("beforeend", `<span class="extract">${esc(it.extract.toUpperCase())}</span>`);
    if(it.context) box.insertAdjacentHTML("beforeend", `<div class="context">${esc(it.context)}</div>`);
    const short = it.o.every(o => o.length <= 30);
    const q = document.createElement("div"); q.className = "q"; q.id = "q-" + n;
    q.innerHTML = `<span class="num">${n}</span><div class="qbody"><div class="qt">${esc(it.q)}</div><div class="opts${short ? " row" : ""}">` +
      it.o.map((o, oi) => `<label class="opt" data-l="${L(oi)}"><input type="radio" name="r${n}" value="${L(oi)}"><span class="bx">${L(oi)}</span><span>${esc(o)}</span></label>`).join("") + `</div></div>`;
    q.addEventListener("change", e => { if(e.target.name === "r" + n) setAnswer(n, e.target.value); });
    q.addEventListener("click", () => setCur(n));
    box.appendChild(q);
  });
}

let selChip = null;
function buildMatch(box, g, stacked){
  const pool = document.createElement("div"); pool.className = "pool";
  g.options.forEach((o, oi) => {
    const c = document.createElement("div"); c.className = "chip"; c.draggable = true; c.dataset.l = L(oi); c.dataset.g = g.first;
    c.innerHTML = `<span class="lb">${L(oi)}</span><span>${esc(o)}</span>`;
    c.addEventListener("dragstart", e => { if(finished) return e.preventDefault(); e.dataTransfer.setData("text/plain", g.first + "|" + L(oi)); });
    c.addEventListener("click", () => {
      if(finished) return;
      if(selChip === c){ c.classList.remove("sel"); selChip = null; return; }
      document.querySelectorAll(".chip.sel").forEach(x => x.classList.remove("sel")); c.classList.add("sel"); selChip = c;
    });
    pool.appendChild(c);
  });
  pool.addEventListener("dragover", e => e.preventDefault());
  pool.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.getData("from"); if(f) setAnswer(+f, null); });
  box.appendChild(pool);
  box.insertAdjacentHTML("beforeend", `<div class="ya">YOUR ANSWERS</div>`);
  const holder = document.createElement("div"); holder.className = stacked ? "rows" : "cards";
  g.items.forEach((lab, i) => {
    const n = g.first + i;
    const c = document.createElement("div"); c.id = "q-" + n;
    if(stacked){ c.className = "srow"; c.innerHTML = `<span class="num">${n}</span><span class="s">${esc(lab)}</span><span class="zt" id="zt-${n}"></span><div class="zone" id="z-${n}"></div>`; }
    else { c.className = "scard"; c.innerHTML = `<div class="h"><span class="num">${n}</span>${esc(lab)}</div><div class="zone" id="z-${n}"></div><div class="zt" id="zt-${n}"></div>`; }
    const z = c.querySelector(".zone");
    z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", e => {
      e.preventDefault(); z.classList.remove("over"); if(finished) return;
      const [gf, l] = (e.dataTransfer.getData("text/plain") || "").split("|");
      if(+gf !== g.first || !l) return;
      const f = e.dataTransfer.getData("from"); if(f && +f !== n) setAnswer(+f, null);
      setAnswer(n, l);
    });
    z.addEventListener("dragstart", e => { if(!answers[n] || finished) return e.preventDefault(); e.dataTransfer.setData("text/plain", g.first + "|" + answers[n]); e.dataTransfer.setData("from", n); });
    z.addEventListener("click", () => {
      setCur(n); if(finished) return;
      if(selChip && +selChip.dataset.g === g.first){ setAnswer(n, selChip.dataset.l); selChip.classList.remove("sel"); selChip = null; }
      else if(answers[n]) setAnswer(n, null);
    });
    holder.appendChild(c);
  });
  box.appendChild(holder);
}

function groupOf(n){ return questions[n - 1].group; }
function renderZone(n){
  const g = groupOf(n), z = $("#z-" + n), l = answers[n];
  z.textContent = l || ""; z.draggable = !!l && !finished;
  $("#zt-" + n).textContent = l ? g.options[l.charCodeAt(0) - 65] : "";
}
function refreshPool(g){
  const used = new Set(); for(let n = g.first; n <= g.last; n++) if(answers[n]) used.add(answers[n]);
  document.querySelectorAll(`.chip[data-g="${g.first}"]`).forEach(c => c.classList.toggle("used", used.has(c.dataset.l)));
}
function markMcq(n){ document.querySelectorAll(`#q-${n} .opt`).forEach(o => o.classList.toggle("sel", o.dataset.l === answers[n])); }

function setAnswer(n, val){
  if(finished) return;
  const g = groupOf(n);
  if(g.type === "match" && val){ for(let m = g.first; m <= g.last; m++) if(m !== n && answers[m] === val){ delete answers[m]; renderZone(m); } }
  if(val) answers[n] = val; else delete answers[n];
  if(g.type === "match"){ renderZone(n); refreshPool(g); } else markMcq(n);
  setCur(n); save(); updateFooter();
}
function restoreAnswers(){
  Object.keys(answers).forEach(k => {
    const n = +k, q = questions[n - 1]; if(!q) return;
    if(q.group.type === "mcq"){ const r = document.querySelector(`input[name="r${n}"][value="${answers[n]}"]`); if(r) r.checked = true; markMcq(n); }
    else renderZone(n);
  });
  DATA.parts.forEach(p => p.groups.forEach(g => { if(g.type === "match") refreshPool(g); }));
  updateFooter();
}

/* ---------- navigation ---------- */
function buildFooter(){
  const f = $("#parts"); f.innerHTML = "";
  DATA.parts.forEach((p, pi) => {
    const b = document.createElement("div"); b.className = "pblk"; b.id = "pb-" + pi;
    let btns = ""; for(let n = p.first; n <= p.last; n++) btns += `<button class="qb" id="qb-${n}" data-n="${n}">${n}</button>`;
    b.innerHTML = `<span class="pl">Part ${pi + 1}</span><span class="cnt"></span><span class="qbs" style="display:flex;gap:5px">${btns}</span>`;
    b.addEventListener("click", e => { const n = e.target.dataset && e.target.dataset.n; if(n) goTo(+n); else if(pi !== curPart) showPart(pi); });
    f.appendChild(b);
  });
}
function updateFooter(){
  DATA.parts.forEach((p, pi) => {
    const b = $("#pb-" + pi); if(!b) return;
    let c = 0; for(let n = p.first; n <= p.last; n++){ const a = !!answers[n]; if(a) c++; $("#qb-" + n).classList.toggle("ans", a); }
    b.classList.toggle("on", pi === curPart);
    b.querySelector(".qbs").style.display = pi === curPart ? "flex" : "none";
    b.querySelector(".cnt").textContent = pi === curPart ? "" : c + " of " + (p.last - p.first + 1);
  });
  document.querySelectorAll(".qb").forEach(x => x.classList.toggle("cur", +x.dataset.n === curQ));
}
function showPart(pi){
  curPart = pi;
  document.querySelectorAll(".part").forEach((s, i) => s.classList.toggle("on", i === pi));
  $("#qarea").scrollTop = 0;
  const p = DATA.parts[pi]; if(curQ < p.first || curQ > p.last) curQ = p.first;
  setCur(curQ);
}
function setCur(n){
  curQ = n;
  document.querySelectorAll(".q.cur,.zone.cur").forEach(x => x.classList.remove("cur"));
  const el = groupOf(n).type === "mcq" ? $("#q-" + n) : $("#z-" + n); if(el) el.classList.add("cur");
  updateFooter();
}
function goTo(n){
  const pi = questions[n - 1].part; if(pi !== curPart) showPart(pi);
  setCur(n); const el = $("#q-" + n); if(el) el.scrollIntoView({block: "center", behavior: "smooth"});
}
$("#next").onclick = () => { if(curQ < TOTAL) goTo(curQ + 1); };
$("#prev").onclick = () => { if(curQ > 1) goTo(curQ - 1); };

/* ---------- highlighter ---------- */
const pop = $("#hlpop"); let hlRange = null;
document.addEventListener("mouseup", e => {
  if(pop.contains(e.target)) return;
  setTimeout(() => {
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || !$("#qarea").contains(sel.anchorNode)){ pop.classList.add("hidden"); return; }
    hlRange = sel.getRangeAt(0).cloneRange();
    const r = hlRange.getBoundingClientRect();
    pop.style.left = Math.max(8, r.left + r.width / 2 - 70) + "px"; pop.style.top = Math.max(8, r.top - 42) + "px";
    pop.classList.remove("hidden");
  }, 0);
});
function rootOf(r){ const c = r.commonAncestorContainer; return c.nodeType === 3 ? c.parentNode : c; }
$("#hl-on").onclick = () => {
  if(!hlRange) return;
  const w = document.createTreeWalker(rootOf(hlRange), NodeFilter.SHOW_TEXT), list = []; let t;
  while((t = w.nextNode())) if(hlRange.intersectsNode(t) && t.nodeValue.trim() && !t.parentNode.closest(".zone,.qb,.num,.bx,.lb")) list.push(t);
  list.forEach(t => {
    let s = 0, e = t.nodeValue.length;
    if(t === hlRange.startContainer) s = hlRange.startOffset;
    if(t === hlRange.endContainer) e = hlRange.endOffset;
    if(e <= s) return;
    const mid = t.splitText(s); mid.splitText(e - s);
    const m = document.createElement("mark"); m.className = "hl"; mid.parentNode.insertBefore(m, mid); m.appendChild(mid);
  });
  window.getSelection().removeAllRanges(); pop.classList.add("hidden");
};
$("#hl-off").onclick = () => {
  if(!hlRange) return;
  const root = rootOf(hlRange); const ms = [...root.querySelectorAll("mark.hl")]; const up = root.closest("mark.hl"); if(up) ms.push(up);
  ms.forEach(m => { if(hlRange.intersectsNode(m)){ const p = m.parentNode; while(m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); } });
  window.getSelection().removeAllRanges(); pop.classList.add("hidden");
};

/* ---------- finish, results, review ---------- */
$("#submit").onclick = () => {
  if(finished){ $("#m-res").classList.remove("hidden"); return; }
  const left = TOTAL - Object.keys(answers).length;
  $("#m-confirm-txt").textContent = (left ? "You have " + left + " unanswered question" + (left > 1 ? "s" : "") + ". " : "") +
    (audioDone ? "Your answers will be marked now." : "The recording is still playing. If you finish now, the audio stops and your answers are marked.");
  $("#m-confirm").classList.remove("hidden");
};
$("#mc-no").onclick = () => $("#m-confirm").classList.add("hidden");
$("#mc-yes").onclick = () => { $("#m-confirm").classList.add("hidden"); finish(); };

function optText(q, l){ if(!l) return "—"; const g = q.group, n = q.n; const arr = g.type === "mcq" ? g.items[n - g.first].o : g.options; return l + "  " + (arr[l.charCodeAt(0) - 65] || ""); }
function finish(){
  if(finished) return; finished = true;
  clearInterval(checkTimer); audioDone = true; try{ aud.pause(); }catch(e){}
  $("#h-pill").classList.add("off"); $("#h-status").textContent = "Test finished"; $("#h-time").textContent = "";
  document.querySelectorAll("#qarea input").forEach(i => i.disabled = true);
  document.querySelectorAll(".zone").forEach(z => z.draggable = false);
  let total = 0, rows = ""; const per = DATA.parts.map(() => 0);
  questions.forEach(q => {
    const n = q.n, mine = answers[n] || "", key = DATA.key[n - 1], ok = mine === key;
    if(ok){ total++; per[q.part]++; }
    rows += `<tr><td>${n}</td><td>${esc(optText(q, mine))}</td><td>${esc(optText(q, key))}</td><td class="${ok ? "ok" : "no"}">${ok ? "✓" : "✗"}</td></tr>`;
  });
  $("#r-day").textContent = "DAY " + DD;
  $("#r-name").textContent = name;
  $("#r-score").innerHTML = total + ' <span>/ ' + TOTAL + '</span>';
  $("#r-parts").innerHTML = DATA.parts.map((p, i) => `<div>Part ${i + 1}<b>${per[i]} / ${p.last - p.first + 1}</b></div>`).join("");
  $("#r-body").innerHTML = rows;
  try{ localStorage.removeItem(STORE); }catch(e){}
  $("#m-res").classList.remove("hidden");
}
$("#r-review").onclick = () => { $("#m-res").classList.add("hidden"); review(); };
$("#r-again").onclick = () => { try{ localStorage.removeItem(STORE); }catch(e){} location.reload(); };
function review(){
  if(reviewing) return; reviewing = true;
  questions.forEach(q => {
    const n = q.n, key = DATA.key[n - 1], mine = answers[n], ok = mine === key;
    $("#qb-" + n).classList.add(ok ? "ok" : "no");
    if(q.group.type === "mcq"){
      document.querySelectorAll(`#q-${n} .opt`).forEach(o => { o.classList.remove("sel"); if(o.dataset.l === key) o.classList.add("right"); else if(o.dataset.l === mine) o.classList.add("wrong"); });
    } else {
      const z = $("#z-" + n); z.classList.add(ok ? "right" : "wrong");
      if(!mine) z.textContent = "–";
      if(!ok) $("#zt-" + n).innerHTML = `<span class="fix">✓ ${key}  ${esc(q.group.options[key.charCodeAt(0) - 65])}</span>`;
    }
  });
  showPart(0);
}
window.addEventListener("beforeunload", e => { if(!$("#exam").classList.contains("hidden") && !finished){ e.preventDefault(); e.returnValue = ""; } });
</script>
<script src="../../track.js" defer></script>
</body>
</html>
